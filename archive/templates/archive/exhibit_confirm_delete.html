{% extends "archive/base.html" %}

{% block title %}
Удаление {{ exhibit.title }}
{% endblock %}

{% block content %}

<h1>Удалить экспонат?</h1>

<p>
    Вы действительно хотите удалить
    «{{ exhibit.title }}»?
</p>

<p>
    Это действие нельзя отменить.
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Удалить
    </button>
</form>

<p>
    <a href="{% url 'archive:exhibit_detail' exhibit.pk %}">
        Отмена
    </a>
</p>

{% endblock %}
