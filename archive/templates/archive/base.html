<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Solemnace Galleries{% endblock %}
    </title>
</head>
<body>

<header>
    <nav>
        <a href="{% url 'archive:home' %}">
            Solemnace Galleries
        </a>

        |
        <a href="{% url 'archive:location_list' %}">
            Локации
        </a>

        |
        <a href="{% url 'archive:gallery_list' %}">
            Галереи
        </a>

        |
        <a href="{% url 'archive:exhibit_list' %}">
            Экспонаты
        </a>

            {% if user.is_authenticated %}
        |
        <a href="{% url 'archive:exhibit_create' %}">
            Создать экспонат
        </a>
        
        |
        <a href="{% url 'archive:my_exhibits' %}">
            Мои экспонаты
        </a>

        |

        <span>
            {{ user.username }}
        </span>

        <form
            method="post"
            action="{% url 'accounts:logout' %}"
            style="display: inline;"
        >
            {% csrf_token %}

            <button type="submit">
                Выйти
            </button>
        </form>

            {% else %}

        |
        <a href="{% url 'accounts:login' %}">
            Войти
        </a>

        |
        <a href="{% url 'accounts:register' %}">
            Регистрация
        </a>

            {% endif %}
    </nav>
</header>

<hr>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
