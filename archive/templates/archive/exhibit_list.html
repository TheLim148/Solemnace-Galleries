<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Экспонаты — Solemnace Galleries</title>
</head>
<body>
    <h1>Экспонаты</h1>

    <a href="{% url 'archive:home' %}">
        На главную
    </a>

    {% if exhibits %}
        <ul>
            {% for exhibit in exhibits %}
                <li>
                    <a href="{% url 'archive:exhibit_detail' exhibit.pk %}">
                        {{ exhibit.title }}
                    </a>

                    — {{ exhibit.category.name }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Опубликованных экспонатов пока нет.</p>
    {% endif %}
</body>
</html>
