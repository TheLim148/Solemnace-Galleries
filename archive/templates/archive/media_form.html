{% extends "archive/base.html" %}

{% block title %}
Добавить медиа — {{ exhibit.title }}
{% endblock %}

{% block content %}

<h1>Добавить медиаматериал</h1>

<p>
    Экспонат: {{ exhibit.title }}
</p>

<form
    method="post"
    enctype="multipart/form-data"
>
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Загрузить
    </button>
</form>

<p>
    <a href="{% url 'archive:exhibit_detail' exhibit.pk %}">
        Отмена
    </a>
</p>

{% endblock %}
