{% extends "archive/base.html" %}

{% block title %}
Вход — Solemnace Galleries
{% endblock %}

{% block content %}

<h1>Вход</h1>

{% if form.errors %}
    <p>
        Неверное имя пользователя или пароль.
    </p>
{% endif %}

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Войти
    </button>
</form>

<p>
    Нет аккаунта?
    <a href="{% url 'accounts:register' %}">
        Зарегистрироваться
    </a>
</p>

{% endblock %}
